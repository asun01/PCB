name: Documentation Integrity

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate baseline documents
        run: python3 tools/validate_docs.py
      - name: Rebuild convenience master
        run: python3 tools/build_master.py
